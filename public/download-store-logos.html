<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AllDocKit Toolkit - Official Microsoft Store Logos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #090d16; color: #f1f5f9; padding: 40px 20px; text-align: center; }
    h1 { font-size: 26px; margin-bottom: 8px; color: #38bdf8; }
    p { color: #94a3b8; margin-bottom: 30px; font-size: 15px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; max-width: 960px; margin: 0 auto; }
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .img-box { width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    .img-box img { max-width: 100%; max-height: 100%; border-radius: 12px; }
    .title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
    .dim { color: #10b981; font-weight: bold; font-size: 13px; margin-bottom: 16px; }
    .btn { background: #0284c7; color: white; padding: 10px 16px; border-radius: 8px; font-weight: 600; text-decoration: none; width: 100%; display: inline-block; transition: 0.2s; font-size: 14px; }
    .btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <h1>AllDocKit Toolkit - Store Logos</h1>
  <p>Right click any image to save, or click the download button.</p>

  <div class="grid">
    <div class="card">
      <div class="img-box"><img src="/logo_300x300.png" alt="300x300"></div>
      <div class="title">App Tile Icon</div>
      <div class="dim">300 x 300 px</div>
      <a class="btn" href="/logo_300x300.png" download="Square300x300Logo.png">📥 Download 300x300</a>
    </div>

    <div class="card">
      <div class="img-box"><img src="/logo_150x150.png" alt="150x150"></div>
      <div class="title">Medium Tile Icon</div>
      <div class="dim">150 x 150 px</div>
      <a class="btn" href="/logo_150x150.png" download="Square150x150Logo.png">📥 Download 150x150</a>
    </div>

    <div class="card">
      <div class="img-box"><img src="/logo_71x71.png" alt="71x71"></div>
      <div class="title">Small Tile Icon</div>
      <div class="dim">71 x 71 px</div>
      <a class="btn" href="/logo_71x71.png" download="Square71x71Logo.png">📥 Download 71x71</a>
    </div>

    <div class="card">
      <div class="img-box"><img src="/logo_1080x1080.png" alt="1080x1080"></div>
      <div class="title">1:1 Box Art Logo</div>
      <div class="dim">1080 x 1080 px</div>
      <a class="btn" href="/logo_1080x1080.png" download="Store1080x1080BoxArt.png">📥 Download 1080x1080</a>
    </div>
  </div>
</body>
</html>
