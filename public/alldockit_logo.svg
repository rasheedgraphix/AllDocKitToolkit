<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="adk_bg" x1="64" y1="40" x2="448" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="adk_rim" x1="100" y1="50" x2="400" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.1" />
    </linearGradient>

    <!-- Primary Document Layer (Vibrant Emerald / Cyan) -->
    <linearGradient id="adk_doc_primary" x1="160" y1="110" x2="350" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Overlapping Document Layer (Crisp Crimson PDF) -->
    <linearGradient id="adk_doc_pdf" x1="200" y1="160" x2="380" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>

    <!-- Folded Corner Gradient -->
    <linearGradient id="adk_fold" x1="290" y1="120" x2="350" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <!-- Tool / Star Sparkle Gradient -->
    <linearGradient id="adk_sparkle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="adk_shadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- App Icon Rounded Squircle (Standard Store 108px radius on 512 canvas) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#adk_bg)" stroke="#1E293B" stroke-width="4" />
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="url(#adk_rim)" stroke-width="4" />

  <!-- Main Graphic Container with 3D Depth Shadow -->
  <g filter="url(#adk_shadow)">
    <!-- Document Stack Layer 1 (Back Document - Blue / Indigo) -->
    <path d="M128 160C128 142.327 142.327 128 160 128H270L340 198V330C340 347.673 325.673 362 308 362H160C142.327 362 128 347.673 128 330V160Z" fill="#1E293B" stroke="#334155" stroke-width="6" />

    <!-- Document Stack Layer 2 (Primary Emerald Green Document) -->
    <path d="M152 140C152 122.327 166.327 108 184 108H300L370 178V350C370 367.673 355.673 382 338 382H184C166.327 382 152 367.673 152 350V140Z" fill="url(#adk_doc_primary)" />

    <!-- Emerald Folded Top-Right Corner -->
    <path d="M300 108V154C300 167.255 310.745 178 324 178H370L300 108Z" fill="url(#adk_fold)" />

    <!-- Document Stack Layer 3 (Foreground PDF Red & White Sheet) -->
    <rect x="188" y="180" width="180" height="200" rx="18" fill="url(#adk_doc_pdf)" stroke="#090D16" stroke-width="6" />

    <!-- Modern Typographic Lines on Foreground Document -->
    <rect x="220" y="218" width="70" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="220" y="246" width="116" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.75" />
    <rect x="220" y="270" width="96" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.75" />
    <rect x="220" y="294" width="60" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.75" />

    <!-- "ALL" Monogram Stamp / Badge in Bottom-Right -->
    <circle cx="340" cy="350" r="38" fill="#0F172A" stroke="#38BDF8" stroke-width="4" />
    <path d="M328 360L340 334L352 360H346L343.5 354H336.5L334 360H328ZM338 350H342L340 344L338 350Z" fill="#38BDF8" />

    <!-- Golden Pro / Toolkit Sparkle Star -->
    <path d="M208 142L213.5 156.5L228 162L213.5 167.5L208 182L202.5 167.5L188 162L202.5 156.5L208 142Z" fill="url(#adk_sparkle)" />
    <circle cx="250" cy="148" r="4" fill="#FDE047" />
  </g>
</svg>
